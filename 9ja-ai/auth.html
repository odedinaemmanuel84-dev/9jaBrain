<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija AI | Welcome</title>
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="auth-header">
                <div class="modern-logo">
                    <i class="fas fa-brain"></i>
                    <span>Naija AI</span>
                </div>
                <p class="subtitle">Next-gen intelligence for the culture.</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button id="loginTab" class="tab-btn active" onclick="toggleAuth('login')">Sign In</button>
                <button id="registerTab" class="tab-btn" onclick="toggleAuth('register')">Join Us</button>
            </div>

            <!-- Form -->
            <form id="authForm" class="auth-form">
                <div id="nameField" class="input-container" style="display: none;">
                    <label>Full Name</label>
                    <div class="input-box">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" placeholder="Enter your name">
                    </div>
                </div>

                <div class="input-container">
                    <label>Email Address</label>
                    <div class="input-box">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-container">
                    <label>Password</label>
                    <div class="input-box">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" id="authBtn" class="primary-btn">Continue</button>
            </form>
            <p id="authMsg" class="status-msg"></p>
        </div>

        <!-- Moving Features (The Marquee) -->
        <div class="marquee-container">
            <div class="marquee-content">
                <span><i class="fas fa-check-circle"></i> Smart Pidgin Processing</span>
                <span><i class="fas fa-check-circle"></i> 24/7 Gist Mode</span>
                <span><i class="fas fa-check-circle"></i> Secure Authentication</span>
                <span><i class="fas fa-check-circle"></i> Localized AI Logic</span>
                <!-- Duplicate for seamless scroll -->
                <span><i class="fas fa-check-circle"></i> Smart Pidgin Processing</span>
                <span><i class="fas fa-check-circle"></i> 24/7 Gist Mode</span>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
